name: Create Release on Push

on:
  push:
    branches:
      - main  # or 'master' — adjust if your default branch has a different name

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to read tags

      - name: Get latest version tag
        id: get_tag
        run: |
          # Try to get the latest tag matching v[0-9].[0-9].[0-9]
          LATEST_TAG=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LATEST_TAG" ]]; then
            echo "No valid tag found. Starting from v1.1.0"
            LATEST_TAG="v1.1.0"
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Increment minor version
        id: inc_version
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          # Remove leading 'v'
          VERSION=${TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Increment minor, reset patch to 0
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="v${MAJOR}.${NEW_MINOR}.0"
          
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP archive named NURD-Template.zip
        run: |
          zip -r NURD-Template.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.inc_version.outputs.version }}
          name: Release ${{ steps.inc_version.outputs.version }}
          draft: false
          prerelease: false
          files: NURD-Template.zip
          generate_release_notes: true
